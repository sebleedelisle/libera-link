name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LIBUSB_VERSION: 1.0.30

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            preset: release
            artifact: libera-link-macos
            pr_artifact_paths: |
              build/Libera Link.app
              build/libera_link
            package_path: libera-link-macos.dmg
          - os: ubuntu-latest
            preset: linux-release
            artifact: libera-link-linux
            pr_artifact_paths: |
              build/libera_link_gui
              build/libera_link
            package_path: libera-link-linux.AppImage
          - os: windows-2022
            preset: win-release
            artifact: libera-link-windows
            pr_artifact_paths: |
              build/Release/libera_link_gui.exe
              build/Release/libera_link.exe
            package_path: libera-link-windows.zip

    runs-on: ${{ matrix.os }}
    env:
      MACOS_APP_BUNDLE: build/Libera Link.app
      MACOS_APP_EXECUTABLE: build/Libera Link.app/Contents/MacOS/Libera Link
      MACOS_FRAMEWORKS_DIR: build/Libera Link.app/Contents/Frameworks

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Install packaging dependencies (macOS)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          brew list create-dmg >/dev/null 2>&1 || brew install create-dmg

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build imagemagick libusb-1.0-0-dev \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev

      - name: Set up MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Stage libusb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "libusb-$env:LIBUSB_VERSION.7z"
          $extractDir = Join-Path $env:RUNNER_TEMP "libusb-$env:LIBUSB_VERSION-bin"
          $stageDir = Join-Path $env:GITHUB_WORKSPACE "build\libusb-msvc"
          $targetDir = Join-Path $stageDir "libusb_bin\Windows\x64\Release\dll"

          Invoke-WebRequest `
            -Uri "https://github.com/libusb/libusb/releases/download/v$env:LIBUSB_VERSION/libusb-$env:LIBUSB_VERSION.7z" `
            -OutFile $archive
          if (Test-Path $extractDir) {
            Remove-Item -Recurse -Force $extractDir
          }
          New-Item -ItemType Directory -Force $extractDir | Out-Null
          7z x $archive "-o$extractDir" -y

          New-Item -ItemType Directory -Force $targetDir | Out-Null
          Copy-Item "$extractDir\include\libusb.h" $stageDir
          Copy-Item "$extractDir\VS2022\MS64\dll\libusb-1.0.dll" $targetDir
          Copy-Item "$extractDir\VS2022\MS64\dll\libusb-1.0.lib" $targetDir
          Copy-Item "$extractDir\VS2022\MS64\dll\libusb-1.0.pdb" $targetDir

      - name: Configure
        shell: bash
        run: |
          extra_args=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            workspace=$(pwd -W)
            extra_args+=("-DLIBERA_BUNDLED_LIBUSB_DIR=${workspace}/build/libusb-msvc")
          fi
          cmake --preset ${{ matrix.preset }} "${extra_args[@]}"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Import Apple certificate
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Bundle libusb into app (macOS)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          LIBUSB_PATH=$(otool -L "$MACOS_APP_EXECUTABLE" | grep libusb | awk '{print $1}' | sort -u)
          echo "Current libusb path: $LIBUSB_PATH"

          mkdir -p "$MACOS_FRAMEWORKS_DIR"
          cp extern/libera-laser/libs/helios_dac/sdk/cpp/libusb_bin/macOS/libusb-1.0.0.dylib \
            "$MACOS_FRAMEWORKS_DIR/"

          install_name_tool -change "$LIBUSB_PATH" \
            @executable_path/../Frameworks/libusb-1.0.0.dylib \
            "$MACOS_APP_EXECUTABLE"

          if otool -L "$MACOS_APP_EXECUTABLE" | grep -q '@rpath/libusb'; then
            echo "ERROR: libusb is still referenced via @rpath after install_name_tool"
            otool -L "$MACOS_APP_EXECUTABLE" | grep libusb
            exit 1
          fi

          install_name_tool -id @executable_path/../Frameworks/libusb-1.0.0.dylib \
            "$MACOS_FRAMEWORKS_DIR/libusb-1.0.0.dylib"

          echo "Updated library paths:"
          otool -L "$MACOS_APP_EXECUTABLE" | grep libusb

      - name: Sign app bundle
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          codesign --force --options runtime \
            --sign "Developer ID Application: Seb Lee-Delisle (${{ secrets.APPLE_TEAM_ID }})" \
            "$MACOS_FRAMEWORKS_DIR/libusb-1.0.0.dylib"

          codesign --deep --force --options runtime \
            --sign "Developer ID Application: Seb Lee-Delisle (${{ secrets.APPLE_TEAM_ID }})" \
            "$MACOS_APP_BUNDLE"

          codesign --verify --verbose "$MACOS_APP_BUNDLE"

      - name: Notarize app
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$MACOS_APP_BUNDLE" "$RUNNER_TEMP/libera-link-notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/libera-link-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$MACOS_APP_BUNDLE"
          xcrun stapler validate "$MACOS_APP_BUNDLE"
          spctl --assess --type execute --verbose=4 "$MACOS_APP_BUNDLE"

      - name: Package DMG (macOS)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          create-dmg \
            --volname "Libera Link" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Libera Link.app" 150 190 \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "libera-link-macos.dmg" \
            "$MACOS_APP_BUNDLE" || true

          test -f libera-link-macos.dmg

          codesign --force --sign "Developer ID Application: Seb Lee-Delisle (${{ secrets.APPLE_TEAM_ID }})" \
            libera-link-macos.dmg
          codesign --verify --verbose=4 libera-link-macos.dmg

      - name: Notarize DMG (macOS)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit libera-link-macos.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple libera-link-macos.dmg
          xcrun stapler validate libera-link-macos.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 libera-link-macos.dmg

      - name: Sign executable (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE_NAME }}
          cache-dependencies: false
          files-folder: build/Release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          convert icons/libera-link.png -resize 512x512 libera-link.png

          sed 's/^          //' > libera-link.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Libera Link
          Comment=OpenIDN bridge for Libera-compatible laser controllers
          Exec=libera_link_gui
          Icon=libera-link
          Categories=Graphics;AudioVideo;
          Terminal=false
          EOF

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1

          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/libera_link_gui \
            --desktop-file libera-link.desktop \
            --icon-file libera-link.png

          export OUTPUT=libera-link-linux.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      - name: Package (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p staging/libera-link
          cp build/Release/libera_link_gui.exe staging/libera-link/
          cp build/Release/libera_link.exe staging/libera-link/
          LIBUSB_DLL_DIR="build/libusb-msvc/libusb_bin/Windows/x64/Release/dll"
          if [ ! -f "${LIBUSB_DLL_DIR}/libusb-1.0.dll" ]; then
            LIBUSB_DLL_DIR="extern/libera-laser/libs/helios_dac/sdk/cpp/libusb_bin/Windows/x64/Release/dll"
          fi
          cp "${LIBUSB_DLL_DIR}/libusb-1.0.dll" staging/libera-link/
          cp "${LIBUSB_DLL_DIR}/libusb-1.0.pdb" staging/libera-link/ || true
          cd staging && 7z a ../libera-link-windows.zip libera-link

      - name: Upload PR build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-ci
          if-no-files-found: error
          path: ${{ matrix.pr_artifact_paths }}

      - name: Upload packaged artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.package_path }}

      - name: Cleanup keychain
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            libera-link-macos/libera-link-macos.dmg
            libera-link-linux/libera-link-linux.AppImage
            libera-link-windows/libera-link-windows.zip
          generate_release_notes: true
